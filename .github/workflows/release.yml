name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.1.0); artifacts only, no GitHub Release"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Optional Windows 7/8.1 agent toolchain (go-legacy-win7). Best-effort:
      # if the download fails, standard (Windows 10+) builds still ship and the
      # -win7 packages are simply omitted. Win7 support is validated on real
      # VMs as the Stage 0 acceptance test.
      - name: Set up go-legacy-win7 (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Fetch the newest go-legacy-win7 toolchain (linux-amd64) and verify
          # the binary before exporting it. This reads a third-party repo, so it
          # needs the runner to have outbound access to github.com releases and
          # a token allowed to read public repos — not guaranteed on locked-down
          # runners. On any failure the step is skipped (continue-on-error) and
          # only the standard Windows 10+ agent builds ship; Windows 7/8.1 is
          # validated on real VMs (see the roadmap). A future hardening step can
          # pin the version and verify a published checksum, or mirror the
          # toolchain in an internal artifact store.
          dir="$RUNNER_TEMP/go-win7"
          mkdir -p "$dir"
          if ! resp="$(gh api repos/thongtech/go-legacy-win7/releases/latest 2>"$dir/err.txt")"; then
            echo "cannot read go-legacy-win7 releases (external-repo access may be restricted on this runner):"
            cat "$dir/err.txt"
            exit 1
          fi
          url="$(printf '%s' "$resp" | jq -r '.assets[].browser_download_url | select(test("linux-amd64"))' | head -n1)"
          if [ -z "$url" ]; then echo "no linux-amd64 asset in the latest release"; exit 1; fi
          echo "downloading $url"
          curl -fsSL "$url" -o "$dir/go-win7.tar.gz" || { echo "download failed"; exit 1; }
          tar -xzf "$dir/go-win7.tar.gz" -C "$dir" || { echo "extract failed"; exit 1; }
          gobin="$(find "$dir" -type f -path '*/bin/go' | head -n1)"
          if [ -z "$gobin" ]; then echo "go binary not found in archive"; exit 1; fi
          "$gobin" version || { echo "toolchain not runnable"; exit 1; }
          echo "INVMON_GO_WIN7=$gobin" >> "$GITHUB_ENV"

      - name: Build & package
        run: VERSION="${{ steps.ver.outputs.version }}" bash scripts/build-dist.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invmon-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: InvMon ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
