# golangci-lint v2 configuration. Run: golangci-lint run
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - revive
    - misspell
    - gocritic
    - unconvert
    - bodyclose
    - errorlint
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      # Test files may keep long, explicit table-driven bodies.
      - path: _test\.go
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
