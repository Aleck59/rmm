  # ===========================================================================
  # Web API — алерты и уведомления
  # ===========================================================================
  /api/v1/alert-rules:
    get:
      tags: [alerts]
      operationId: listAlertRules
      summary: Правила алертов
      x-required-role: viewer
      responses:
        '200':
          description: Все правила
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [alerts]
      operationId: createAlertRule
      summary: Создать правило
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
            examples:
              diskC:
                summary: Свободно на C < 10 %
                value:
                  name: Мало места на системном диске
                  enabled: true
                  severity: critical
                  metric: disk_free_pct
                  operator: '<'
                  threshold: 10
                  resolve_threshold: 12
                  duration_s: 0
                  volume_pattern: 'C:'
                  scope: {group_id: null, tag: null}
                  channel_ids: [1, 2]
                  renotify_interval_s: 86400
              cpu:
                summary: CPU > 90 % дольше 15 минут
                value:
                  name: Высокая загрузка CPU
                  severity: warning
                  metric: cpu_pct
                  operator: '>'
                  threshold: 90
                  resolve_threshold: 80
                  duration_s: 900
                  scope: {group_id: 3, tag: null}
                  channel_ids: [1]
              offline:
                summary: Нет данных дольше 10 минут
                value:
                  name: Устройство не на связи
                  severity: warning
                  metric: offline
                  duration_s: 600
                  channel_ids: [1]
      responses:
        '201':
          description: Правило создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alert-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
