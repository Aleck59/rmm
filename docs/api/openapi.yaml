    AlertRuleInput:
      type: object
      description: |
        Для `offline`: `operator` и `threshold` не задаются, `duration_s` > 0 — порог отсутствия данных.
        Для остальных метрик условие должно выполняться на всём окне `duration_s`
        (0 — по последнему значению). `resolve_threshold` задаёт гистерезис закрытия.
        `volume_pattern` обязателен для `disk_*` (`C:` или `*` — все фиксированные тома).
      required: [name, severity, metric]
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          default: true
        severity:
          $ref: '#/components/schemas/Severity'
        metric:
          $ref: '#/components/schemas/AlertMetric'
        operator:
          type: [string, 'null']
          enum: ['>', '>=', '<', '<=', null]
        threshold:
          type: [number, 'null']
        resolve_threshold:
          type: [number, 'null']
        duration_s:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
        volume_pattern:
          type: [string, 'null']
          pattern: '^([A-Z]:|\*)$'
        scope:
          type: object
          properties:
            group_id:
              type: [integer, 'null']
              format: int64
            tag:
              type: [string, 'null']
        channel_ids:
          type: array
          items:
            type: integer
            format: int64
        renotify_interval_s:
          type: [integer, 'null']
          minimum: 300

