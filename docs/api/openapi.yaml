  # ===========================================================================
  # Web API — модуль выполнения скриптов и управления ПО (v2.0, проект)
  # Изменяющие операции требуют повторного входа не старше 10 минут (step-up),
  # пишутся в аудит и пересылаются в SIEM. Инварианты дублируются в БД
  # (docs/db/schema_execution.sql) и независимо проверяются агентом.
  # ===========================================================================
  /api/v1/scripts:
    get:
      tags: [scripts]
      operationId: listScripts
      summary: Библиотека скриптов
      x-required-permission: [script.author, script.approve, script.run, script.run_high_impact]
      parameters:
        - name: q
          in: query
          description: Поиск по названию и категории
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница библиотеки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [scripts]
      operationId: createScript
      summary: Создать скрипт (карточка; код — в версиях)
      x-required-permission: script.author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptInput'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scripts/{scriptId}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    get:
      tags: [scripts]
      operationId: getScript
      summary: Скрипт и список его версий
      x-required-permission: [script.author, script.approve, script.run, script.run_high_impact]
      responses:
        '200':
          description: Скрипт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scripts/{scriptId}/versions:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    post:
      tags: [scripts]
      operationId: createScriptVersion
      summary: Создать черновик новой версии
      x-required-permission: script.author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptVersionInput'
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/script-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [scripts]
      operationId: getScriptVersion
      summary: Версия скрипта — код, параметры, ограничения, подписи
      x-required-permission: [script.author, script.approve, script.run, script.run_high_impact]
      responses:
        '200':
          description: Версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [scripts]
      operationId: updateScriptVersion
      summary: Изменить черновик (только автор и только в статусе draft)
      x-required-permission: script.author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptVersionInput'
      responses:
        '200':
          description: Черновик обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/script-versions/{versionId}/submit:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [scripts]
      operationId: submitScriptVersion
      summary: Отправить версию на согласование
      description: |
        Сервер проверяет версию статически (схема параметров, размер, запрещённые конструкции —
        docs/execution.md, 5.3), формирует манифест — канонический JSON (RFC 8785) вместе с кодом
        скрипта — и фиксирует его байты. Версия становится неизменяемой и появляется в
        `GET /api/v1/signing-requests`: подписывают автор и другой сотрудник с `script.approve`.
      x-required-permission: script.author
      responses:
        '200':
          description: Версия отправлена (`pending_approval`, заполнен `manifest_sha256`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/script-versions/{versionId}/retire:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [scripts]
      operationId: retireScriptVersion
      summary: Вывести версию из обращения
      description: Новые запуски версии невозможны; открытые задачи этой версии отменяются.
      x-required-permission: [script.approve, execution.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '204':
          description: Выведена из обращения
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/signing-requests:
    get:
      tags: [signing]
      operationId: listSigningRequests
      summary: Что ждёт моей подписи
      description: |
        Список для утилиты `invmon-sign` на рабочем месте сотрудника. Автор или инициатор видит свои
        отправленные объекты (роль `author`). Согласующий видит чужие объекты, на согласование
        которых у него есть право (роль `approver`); свои объекты согласующему не показываются.
      x-required-permission: [script.author, script.approve, package.manage, package.approve, script.run, script.run_high_impact, deployment.run]
      responses:
        '200':
          description: Объекты, ожидающие подписи текущего пользователя
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SigningRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/signing-requests/{subjectType}/{subjectId}/manifest:
    parameters:
      - $ref: '#/components/parameters/SubjectType'
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [signing]
      operationId: getSigningManifest
      summary: Точные байты манифеста для подписи
      description: |
        Возвращает ровно те байты, которые подписываются и которые получит агент. `invmon-sign`
        сам считает SHA-256 и показывает сотруднику содержимое — код скрипта, аргументы установщика,
        список ПК — из этих байтов, а не из веб-интерфейса. Затем подписывает ключом на токене
        (PIN + касание).
      x-required-permission: [script.author, script.approve, package.manage, package.approve, script.run, script.run_high_impact, deployment.run]
      responses:
        '200':
          description: Манифест (UTF-8 JSON, байты не нормализовать)
          headers:
            Repr-Digest:
              description: RFC 9530, SHA-256 манифеста
              schema:
                type: string
              example: 'sha-256=:MFNyB1PBlDiEii6QOApEGp89sI4iEJDY/o9VxTDlzl0=:'
          content:
            application/vnd.invmon.manifest+json:
              schema:
                type: string
                contentMediaType: application/json
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/signing-requests/{subjectType}/{subjectId}/signatures:
    parameters:
      - $ref: '#/components/parameters/SubjectType'
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [signing]
      operationId: addSignature
      summary: Добавить подпись автора или согласующего
      description: |
        Сервер проверяет подпись ECDSA P-256 открытым ключом с указанным отпечатком. Ключ должен
        принадлежать текущему пользователю и не быть отозван. Проверяются также роль подписанта
        (автор или инициатор против согласующего) и совпадение с текущим манифестом; те же
        инварианты закреплены в БД. Когда есть обе подписи, объект переходит дальше автоматически:
        версия — в `approved`, запуск или развёртывание — в `scheduled`.
      x-required-permission: [script.author, script.approve, package.manage, package.approve, script.run, script.run_high_impact, deployment.run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureInput'
      responses:
        '201':
          description: Подпись принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/signing-requests/{subjectType}/{subjectId}/reject:
    parameters:
      - $ref: '#/components/parameters/SubjectType'
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [signing]
      operationId: rejectSigningRequest
      summary: Отклонить (согласующий)
      description: Версия переходит в `rejected`, запуск или развёртывание — в `canceled`.
      x-required-permission: [script.approve, package.approve]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '204':
          description: Отклонено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/script-runs:
    get:
      tags: [script-runs]
      operationId: listScriptRuns
      summary: Запуски скриптов
      x-required-permission: [script.run, script.run_high_impact, task.view_output, task.cancel_any]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: script_id
          in: query
          schema:
            type: integer
            format: int64
        - name: created_by
          in: query
          description: Логин инициатора
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница запусков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRunPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [script-runs]
      operationId: createScriptRun
      summary: Запустить скрипт на выбранных ПК (поставить задачи в очередь)
      description: |
        1. Проверки сервера: версия `approved`; параметры проходят `params_schema` версии; у
           инициатора есть `script.run` (для скриптов high_impact — `script.run_high_impact`) в группе
           **каждого** целевого ПК, иначе 403 со списком ПК; повторный вход не старше 10 минут.
        2. Цели разрешаются в список ПК. ПК, на которых задача заведомо не выполнится, попадают в
           `excluded` с причиной: выполнение выключено локальной политикой, ПК не доверяет ключам
           подписантов версии, ОС или PowerShell ниже требуемых.
        3. На каждый ПК создаётся строка `agent_tasks` в состоянии `queued`; агенты забирают задачи
           сами (`POST /api/agent/v1/tasks/claim`).
        4. Если скрипт помечен high_impact или ПК больше `approval_required_above_targets` (по умолчанию 25),
           запуск создаётся в статусе `pending_approval` с манифестом запуска. Его подписывают
           инициатор и другой сотрудник с `script.approve`; до этого задачи не выдаются.

        Заголовок `Idempotency-Key` защищает от двойного запуска при повторе запроса.
      x-required-permission: [script.run, script.run_high_impact]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptRunInput'
      responses:
        '201':
          description: Запуск создан, задачи поставлены в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRun'
              examples:
                scheduled:
                  summary: Обычный запуск — задачи сразу доступны агентам
                  value:
                    id: 311
                    status: scheduled
                    script: {id: 12, name: Очистка временных файлов Windows, version_id: 42, version: 3, high_impact: false}
                    parameters: {min_age_days: 7}
                    targets: {group_ids: [3]}
                    target_count: 18
                    excluded:
                      - {device_id: 57, hostname: PC-ACC-031, reason: execution_disabled_locally}
                    reason: 'INC-1024: мало места на C: у бухгалтерии'
                    created_by: {id: 4, username: sidorov, display_name: Сидоров С. С.}
                    created_at: '2026-09-29T08:00:00Z'
                    not_before: '2026-09-29T08:00:00Z'
                    expires_at: '2026-09-30T08:00:00Z'
                    max_concurrency: 10
                    requires_approval: false
                    signatures: []
                    counts: {tasks: 18, queued: 18, in_progress: 0, succeeded: 0, failed: 0, lost: 0, rejected: 0, canceled_or_expired: 0, reboot_required: 0}
                pendingApproval:
                  summary: Скрипт high_impact — ждёт подписей инициатора и согласующего
                  value:
                    id: 318
                    status: pending_approval
                    script: {id: 15, name: Сброс кэша Windows Update, version_id: 51, version: 1, high_impact: true}
                    parameters: {}
                    targets: {device_ids: [42]}
                    target_count: 1
                    excluded: []
                    reason: 'INC-1040: не устанавливаются обновления'
                    created_by: {id: 4, username: sidorov, display_name: Сидоров С. С.}
                    created_at: '2026-09-29T08:05:00Z'
                    not_before: '2026-09-29T08:05:00Z'
                    expires_at: '2026-09-30T08:05:00Z'
                    requires_approval: true
                    run_manifest_sha256: 439f8b953015962f2ac79687fa7dc263837fcfca216b4fd44bfa6d78f325f391
                    signatures: []
                    counts: {tasks: 1, queued: 1, in_progress: 0, succeeded: 0, failed: 0, lost: 0, rejected: 0, canceled_or_expired: 0, reboot_required: 0}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

