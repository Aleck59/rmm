      tags: [alerts]
      operationId: getAlertRule
      summary: Правило
      x-required-role: viewer
      responses:
        '200':
          description: Правило
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [alerts]
      operationId: replaceAlertRule
      summary: Изменить правило
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: Правило обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [alerts]
      operationId: deleteAlertRule
