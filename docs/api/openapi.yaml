openapi: 3.1.0
info:
  title: InvMon API
  version: 1.0.0-draft
  summary: Мониторинг и инвентаризация парка Windows-ПК организации (MVP)
  description: |
    Контракт API (contract-first): из этого файла генерируются серверные интерфейсы
    (oapi-codegen) и TypeScript-типы для веб-интерфейса (openapi-typescript).

    Два независимых набора эндпоинтов на разных портах:

    * **Agent API** — `/api/agent/v1/*`, порт 8443, доступен из сетей рабочих станций.
      Аутентификация: `Authorization: Bearer <токен>` (токен регистрации или токен устройства).
    * **Web API** — `/api/v1/*`, порт 443, доступен только из сети администраторов.
      Аутентификация: сессионная cookie `__Host-invmon_session` (HttpOnly, Secure, SameSite=Strict).

    В MVP агент **не принимает команд**: ответы сервера содержат только декларативную конфигурацию
    сбора данных из фиксированного набора полей.

    **Модуль выполнения скриптов и управления ПО (v2.0, проект — `docs/execution.md`)** добавляет
    теги `scripts`, `signing`, `script-runs`, `packages`, `deployments`, `execution-admin` и эндпоинты
    агента `/api/agent/v1/tasks/*`. Агент сам забирает задачи (pull, без входящих портов) и выполняет
    только код и установщики с двумя подписями (автор и согласующий) ключами из списка доверенных,
    заданного локальной политикой ПК (GPO). По умолчанию выполнение на ПК выключено. Операциям
    модуля нужно явное разрешение из расширения `x-required-permission` в области группы устройств;
    роль из `x-required-role` такого права не даёт.

    Общие соглашения:
    * время — RFC 3339 в UTC; размеры — в байтах (int64); проценты — 0…100;
    * ошибки — RFC 9457 `application/problem+json` с машинным полем `code`;
    * списки — курсорная пагинация (`limit`, `cursor` → `next_cursor`);
    * агент может сжимать тело запроса (`Content-Encoding: gzip`); лимит тела после распаковки —
      1 МБ для метрик и 5 МБ для инвентаризации;
    * роль, необходимая для операции Web API, указана в расширении `x-required-role`
      (`viewer` < `operator` < `admin`).
  license:
    name: Proprietary (internal use)
    identifier: LicenseRef-Proprietary

servers:
  - url: https://invmon.corp.local
    description: Web API (порт 443)

tags:
  - name: agent
    description: Эндпоинты для агентов
  - name: auth
    description: Вход в веб-интерфейс
  - name: devices
    description: Устройства, метрики, инвентаризация
  - name: software
    description: Каталог и отчёты по установленному ПО
  - name: alerts
    description: Правила алертов, алерты, каналы уведомлений
  - name: admin
    description: Токены регистрации, аудит
  - name: scripts
    description: Библиотека скриптов PowerShell / CMD и их версии (модуль выполнения, v2.0)
  - name: signing
    description: Подписи автора и согласующего — версии, запуски, развёртывания (v2.0)
  - name: script-runs
    description: Запуски скриптов на ПК и отчёты о выполнении (v2.0)
  - name: packages
    description: Каталог ПО для установки — MSI, EXE, установка скриптом (v2.0)
  - name: deployments
    description: Установка, обновление, удаление ПО; политики желаемого состояния (v2.0)
  - name: execution-admin
    description: Стоп-кран, ключи подписантов, права модуля выполнения (v2.0)

security:
  - session: []

paths:
  # ===========================================================================
  # Agent API
  # ===========================================================================
  /api/agent/v1/enroll:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    post:
      tags: [agent]
      operationId: agentEnroll
      summary: Регистрация агента
      description: |
        Первичная регистрация по токену регистрации (`imenr_…`). Идемпотентна по `agent_uid`:
        повтор после потерянного ответа не создаёт дубль, а перевыпускает токен устройства.
        Токен устройства возвращается один раз; сервер хранит только его SHA-256.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
      responses:
        '201':
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/agent/v1/metrics:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    post:
      tags: [agent]
      operationId: agentPostMetrics
      summary: Пачка метрик (одновременно heartbeat)
      description: |
        Агент отправляет накопленные выборки раз в `metrics_send_interval_s` (по умолчанию 60 с);
        после сбоя связи — из локального буфера, частями до 1000 выборок.
        Повторная отправка безопасна: ключ выборки — (устройство, `ts`[, `volume`]).
        Сервер корректирует метки времени на расхождение часов (`sent_at` против времени сервера).
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsBatch'
      responses:
        '200':
          description: Принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/agent/v1/inventory:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    put:
      tags: [agent]
      operationId: agentPutInventory
      summary: Полный снимок инвентаризации
      description: |
        Отправляется при старте агента, при изменении `inventory_hash` (проверка раз в час)
        и не реже раза в сутки. Сервер сравнивает снимок с текущим состоянием и пишет
        изменения в журнал `inventory_changes`.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: Снимок принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/agent/v1/config:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    get:
      tags: [agent]
      operationId: agentGetConfig
      summary: Конфигурация сбора
      description: Запрашивается, когда `config_version` в ответе на метрики больше локальной.
      security:
        - deviceToken: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          example: '"3"'
      responses:
        '200':
          description: Актуальная конфигурация
          headers:
            ETag:
              schema:
                type: string
              example: '"3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
        '304':
          description: Конфигурация не изменилась
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'

  /api/agent/v1/token/rotate:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    post:
      tags: [agent]
      operationId: agentRotateToken
      summary: Ротация токена устройства
      description: |
        Вызывается, когда сервер вернул `rotate_token: true` (по умолчанию — раз в 90 дней).
        Старый токен остаётся действительным до `previous_valid_until` на случай потери ответа.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Выпущен новый токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRotateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'

  # ---------------------------------------------------------------------------
  # Agent API — модуль выполнения (v2.0, проект; docs/execution.md)
  # ---------------------------------------------------------------------------
  /api/agent/v1/tasks/claim:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    post:
      tags: [agent]
      operationId: agentClaimTasks
      summary: Забрать задачи (pull)
      description: |
        Агент вызывает, когда в ответе на метрики `tasks_pending = true` (задержка — не больше
        интервала отправки метрик, по умолчанию 60 с), и не вызывает, если выполнение выключено
        локальной политикой ПК. Сервер выдаёт задачи атомарно (`claim_agent_tasks`, `FOR UPDATE SKIP
        LOCKED`) с учётом стоп-крана, окна запуска, колец и окна обслуживания развёртываний.
        Выданная задача получает аренду: до `lease_expires_at` агент должен подтвердить старт
        событием `started`, иначе задача вернётся в очередь.

        До выполнения агент **сам** проверяет задачу, не доверяя серверу: подписи автора и
        согласующего над `artifact.manifest` (разные люди, ключи из локального списка доверенных),
        `org` и тип манифеста, схему параметров, ОС и версию PowerShell; для согласованного запуска —
        подписи `run_approval` и то, что ПК есть в его списке. Любое несоответствие — итог `rejected`
        с `error_code`, без запуска.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskClaimRequest'
      responses:
        '200':
          description: Выданные задачи (возможно, пустой список)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/agent/v1/tasks/{taskId}/events:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [agent]
      operationId: agentPostTaskEvent
      summary: Старт, фрагмент вывода или heartbeat задачи
      description: |
        **Двухфазный старт:** агент запускает процесс только после ответа 200 на событие `started`.
        Ответ 409 с `code: task_canceled` означает, что задачу отменили, пока она была в пути, —
        запускать нельзя.

        Во время выполнения агент отправляет фрагменты вывода (не чаще раза в 5 с или по 64 КиБ) и
        heartbeat не реже раза в 10 с. `seq` монотонен: повтор события с уже принятым `seq`
        игнорируется, поэтому повторная отправка после сбоя связи безопасна. Ответ сообщает, запрошена
        ли отмена: тогда агент завершает Job Object задачи и отправляет итог `canceled`.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEventInput'
      responses:
        '200':
          description: Событие принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/agent/v1/tasks/{taskId}/result:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [agent]
      operationId: agentPostTaskResult
      summary: Итог выполнения задачи
      description: |
        Идемпотентно: повтор того же итога — 204; другой итог для уже завершённой задачи — 409.
        Итог принимается и после того, как сервер пометил задачу `lost` (агент был офлайн).
        Агент хранит итог в локальном журнале задач до подтверждения сервером.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskResultInput'
      responses:
        '204':
          description: Итог принят
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/agent/v1/packages/{sha256}:
    servers:
      - url: https://invmon.corp.local:8443
        description: Agent API (порт 8443)
    parameters:
      - name: sha256
        in: path
        required: true
        description: SHA-256 установщика из подписанного манифеста пакета
        schema:
          $ref: '#/components/schemas/Sha256Hex'
    get:
      tags: [agent]
      operationId: agentDownloadPackage
      summary: Скачать установщик
      description: |
        Отдаётся только устройству, у которого есть выданная (`dispatched`/`running`) задача с этим
        установщиком. Поддерживается докачка (`Range`). Агент сверяет SHA-256 и размер с подписанным
        манифестом, держит файл открытым без права записи для других процессов до конца установки
        и проверяет подпись издателя (Authenticode), если её требует манифест.
      security:
        - deviceToken: []
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=1048576-
      responses:
        '200':
          description: Файл целиком
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: Запрошенный диапазон
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Web API — аутентификация
  # ===========================================================================
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по логину и паролю
      description: |
        При успехе устанавливает cookie `__Host-invmon_session`. Ошибка всегда одна и та же
        (`invalid_credentials`), чтобы не раскрывать существование логина. После 10 неудачных
        попыток учётная запись блокируется на 15 минут.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Успешный вход
          headers:
            Set-Cookie:
              schema:
                type: string
              example: __Host-invmon_session=Q2hhbmdlTWU...; Path=/; Secure; HttpOnly; SameSite=Strict
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход (сессия удаляется на сервере)
      x-required-role: viewer
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Текущий пользователь
      x-required-role: viewer
      responses:
        '200':
          description: Пользователь и его роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # Web API — устройства
  # ===========================================================================
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Список устройств с фильтрами
      x-required-role: viewer
      parameters:
        - name: q
          in: query
          description: Поиск по подстроке в hostname / IP / серийном номере
          schema:
            type: string
            maxLength: 100
        - name: group_id
          in: query
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - name: online
          in: query
          schema:
            type: boolean
        - name: has_alerts
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            default: hostname
            enum: [hostname, -hostname, last_seen_at, -last_seen_at, cpu_pct, -cpu_pct,
                   mem_used_pct, -mem_used_pct, min_disk_free_pct, -min_disk_free_pct]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      operationId: getDevice
      summary: Карточка устройства (железо, тома, сеть, состояние)
      x-required-role: viewer
      responses:
        '200':
          description: Карточка устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Изменить группу, теги, заметки
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Удалить устройство вместе с данными
      description: |
        Токен агента перестаёт действовать; действие попадает в аудит.
        С модулем выполнения (v2.0) устройство с историей задач не удаляется (409 — история
        выполнения хранится как доказательная база); его выводят из эксплуатации (`retired`).
      x-required-role: admin
      responses:
        '204':
          description: Удалено
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/devices/{deviceId}/approve:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      operationId: approveDevice
      summary: Одобрить устройство в статусе pending
      x-required-role: operator
      responses:
        '204':
          description: Устройство активировано
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/devices/{deviceId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Отозвать токен устройства (данные сохраняются)
      x-required-role: admin
      responses:
