      operationId: listDeployments
      summary: Развёртывания ПО
      x-required-permission: [deployment.run, task.cancel_any, package.approve]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: package_id
          in: query
          schema:
            type: integer
            format: int64
        - name: policy_id
          in: query
          schema:
