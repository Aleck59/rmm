    # --------------------------------------- Agent API: задачи (v2.0, проект)
    ExecutionCapabilities:
      type: object
      description: |
        Что разрешено на ПК **локальной политикой** (HKLM\SOFTWARE\Policies\InvMon\Agent, GPO), а не
        сервером: сервер не может включить выполнение или добавить доверенный ключ.
      required: [scripts_enabled, packages_enabled, trusted_key_fingerprints]
      properties:
        scripts_enabled:
          type: boolean
        packages_enabled:
          type: boolean
        trusted_key_fingerprints:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Sha256Hex'
        org:
          type: string
          description: OrgId из политики; должен совпадать с полем `org` манифестов
        powershell_version:
          type: [string, 'null']
          examples: ['5.1', '2.0']
    SignedBlob:
      type: object
      required: [manifest, signatures]
      properties:
        manifest:
          type: string
          contentEncoding: base64
          description: |
            Точные подписанные байты — канонический JSON. Агент проверяет подписи над этими байтами
            и только потом разбирает их; код скрипта берётся из манифеста.
        signatures:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: object
            required: [role, key_fingerprint, public_key, signature]
            properties:
              role:
                type: string
                enum: [author, approver]
              key_fingerprint:
                $ref: '#/components/schemas/Sha256Hex'
              public_key:
                type: string
                contentEncoding: base64
                description: |
                  SubjectPublicKeyInfo (DER). Агент принимает ключ, только если SHA-256 от него есть
                  в локальном списке `TrustedSigners`: GPO хранит отпечатки, сервер доставляет ключи
              signature:
                type: string
                contentEncoding: base64
    AgentTask:
      type: object
      required: [task_id, kind, attempt, lease_expires_at, requested_by, reason, artifact]
      properties:
        task_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [script, package]
        attempt:
          type: integer
        lease_expires_at:
          type: string
          format: date-time
          description: До этого времени агент подтверждает старт событием `started`
        requested_by:
          type: string
          description: Логин инициатора — для журнала событий ПК
        reason:
          type: string
        artifact:
          $ref: '#/components/schemas/SignedBlob'
        parameters:
          type: object
          additionalProperties: true
          description: Только для скриптов; агент проверяет по `params_schema` из подписанного манифеста
        run_approval:
          $ref: '#/components/schemas/SignedBlob'
        action:
          type: string
          enum: [install, uninstall, update]
          description: Только для пакетов
        download:
          type: object
          required: [url, sha256, size]
          properties:
            url:
              type: string
              format: uri-reference
            sha256:
              $ref: '#/components/schemas/Sha256Hex'
            size:
              $ref: '#/components/schemas/Bytes'
        deadline:
          type: [string, 'null']
          format: date-time
        reboot_policy:
          type: string
          enum: [suppress, allow_in_window]
    TaskClaimRequest:
      type: object
      required: [max_tasks, capabilities]
      properties:
        max_tasks:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        capabilities:
          $ref: '#/components/schemas/ExecutionCapabilities'
      example:
        max_tasks: 1
        capabilities:
          scripts_enabled: true
          packages_enabled: true
          trusted_key_fingerprints:
            - 0976d74509a4d74b592322296e90d2464ebed6d0604d8b93a7efecac3c690d97
            - 7b1f33d829683c4149dc258514814a5b068fcec2851a2144f284f9adcf4e6fe6
          org: corp.local
          powershell_version: '5.1'
    TaskClaimResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AgentTask'
      example:
        tasks:
          - task_id: 90211
            kind: script
            attempt: 1
            lease_expires_at: '2026-09-29T08:10:41Z'
            requested_by: sidorov
            reason: 'INC-1024: мало места на C: у бухгалтерии'
            artifact:
              manifest: eyJ0eXBlIjoiaW52bW9uLnNjcmlwdC52MSIsIm9yZyI6ImNvcnAubG9jYWwiLCJzY3JpcHRfaWQiOjEyLCJ2ZXJzaW9uIjozfQ==
              signatures:
                - role: author
                  key_fingerprint: 0976d74509a4d74b592322296e90d2464ebed6d0604d8b93a7efecac3c690d97
                  public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEPetrovEXAMPLEonly
                  signature: Ruwuz0MFQWcfKTFN6uR7ixvNeiptEgBFt1hhW/BG+wbr/u/z+t1rug==
                - role: approver
                  key_fingerprint: 7b1f33d829683c4149dc258514814a5b068fcec2851a2144f284f9adcf4e6fe6
                  public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIvanovEXAMPLEonly
                  signature: XdJLZAZ3MW325EOZfEQ8wYojuN+VGHGxxPq0JjRmwaP1uSqrLOWexg==
            parameters: {min_age_days: 7}
            deadline: null
    TaskEventInput:
      type: object
      required: [type, seq, ts]
      properties:
        type:
          type: string
          enum: [started, output, heartbeat]
        seq:
          type: integer
          minimum: 1
          description: Монотонный номер события задачи; повтор уже принятого номера игнорируется
        ts:
          type: string
          format: date-time
        stdout:
          type: string
          maxLength: 65536
          description: Очередной фрагмент вывода (UTF-8)
        stderr:
          type: string
          maxLength: 65536
      example:
        type: output
        seq: 2
        ts: '2026-09-29T08:00:58Z'
        stdout: 'Удалено файлов: 1532, освобождено МБ: 2150.4'
    TaskEventResponse:
      type: object
      required: [cancel_requested, lease_expires_at]
      properties:
        cancel_requested:
          type: boolean
          description: Остановить процесс (завершить Job Object) и прислать итог `canceled`
        lease_expires_at:
          type: string
          format: date-time
          description: До какого времени сервер ждёт итог (таймаут версии + запас)
      example:
        cancel_requested: false
        lease_expires_at: '2026-09-29T08:15:43Z'
    TaskResultInput:
      type: object
      required: [state, finished_at, output_bytes, output_truncated, last_seq]
      properties:
        state:
          type: string
          enum: [succeeded, failed, timed_out, canceled, rejected]
          description: rejected — агент отказался выполнять (процесс не запускался)
        exit_code:
          type: [integer, 'null']
        result:
          type: [string, 'null']
          enum: [installed, already_installed, uninstalled, not_installed, reboot_required, null]
        error_code:
          type: [string, 'null']
          enum: [signature_invalid, untrusted_signer, separation_of_duties, org_mismatch, manifest_invalid,
                 hash_mismatch, params_invalid, execution_disabled, run_not_authorized, not_for_this_device,
                 expired, replay, os_unsupported, powershell_unsupported, arch_mismatch, encoding_unsupported,
                 authenticode_invalid, download_failed, msi_busy, detection_failed, agent_restarted,
                 internal_error, null]
        error_detail:
          type: [string, 'null']
          maxLength: 2000
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: string
          format: date-time
        output_bytes:
          type: integer
          format: int64
          description: Весь вывод процесса, включая отброшенное сверх лимита
        output_truncated:
          type: boolean
        last_seq:
          type: integer
          minimum: 0
          description: Номер последнего отправленного события — сервер проверяет, что вывод получен полностью
      example:
        state: succeeded
        exit_code: 0
        result: null
        error_code: null
        started_at: '2026-09-29T08:00:43Z'
        finished_at: '2026-09-29T08:01:02Z'
        output_bytes: 52
        output_truncated: false
        last_seq: 3
