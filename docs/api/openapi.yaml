          schema:
            $ref: '#/components/schemas/TaskState'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/deployments/{deploymentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    post:
      tags: [deployments]
      operationId: cancelDeployment
      summary: Отменить развёртывание (семантика — как у отмены запуска)
      x-required-permission: [deployment.run, task.cancel_any]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '202':
          description: Отмена принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/deployments/{deploymentId}/pause:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    post:
      tags: [deployments]
      operationId: pauseDeployment
      summary: Приостановить выдачу задач (выполняемые доработают)
      x-required-permission: [deployment.run, task.cancel_any]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '204':
          description: Приостановлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/deployments/{deploymentId}/resume:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    post:
      tags: [deployments]
      operationId: resumeDeployment
      summary: Возобновить (в том числе после автопаузы по порогу ошибок)
      x-required-permission: deployment.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '204':
          description: Возобновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/deployment-policies:
    get:
      tags: [deployments]
      operationId: listDeploymentPolicies
      summary: Политики ПО (обязательное и запрещённое)
      x-required-permission: [deployment.run, package.approve]
      responses:
        '200':
          description: Политики
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeploymentPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [deployments]
      operationId: createDeploymentPolicy
      summary: Создать политику (выключена до одобрения другим сотрудником)
      x-required-permission: deployment.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPolicyInput'
      responses:
        '201':
          description: Политика создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/deployment-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    patch:
      tags: [deployments]
      operationId: updateDeploymentPolicy
      summary: Изменить или выключить политику
      description: |
        Изменение сути политики (область, версия, окна, кольца, порог) снимает одобрение и
        выключает её до повторного одобрения. Выключить (`enabled: false`) можно без одобрения.
      x-required-permission: deployment.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPolicyPatch'
      responses:
        '200':
          description: Политика обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/deployment-policies/{policyId}/approve:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    post:
      tags: [deployments]
      operationId: approveDeploymentPolicy
      summary: Одобрить и включить политику (не автор политики)
      x-required-permission: package.approve
      responses:
        '200':
          description: Политика включена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPolicy'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/deployment-policies/{policyId}/compliance:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [deployments]
      operationId: getPolicyCompliance
      summary: Соответствие политике по данным инвентаризации
      x-required-permission: [deployment.run, package.approve]
      responses:
        '200':
          description: Сводка и несоответствующие ПК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCompliance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/execution/settings:
    get:
      tags: [execution-admin]
      operationId: getExecutionSettings
      summary: Настройки модуля выполнения
      x-required-permission: execution.admin
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [execution-admin]
      operationId: updateExecutionSettings
      summary: Изменить настройки модуля
      description: |
        Включить модуль (`enabled: true`) можно только при настроенной пересылке аудита в SIEM.
        Стоп-кран — отдельный эндпоинт `POST /api/v1/execution/kill-switch`.
      x-required-permission: execution.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionSettings'
      responses:
        '200':
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/execution/kill-switch:
    post:
      tags: [execution-admin]
      operationId: setKillSwitch
      summary: Стоп-кран — остановить или возобновить выдачу задач на весь парк
      description: |
        `engaged: true` — сервер перестаёт выдавать задачи, агенты получают `execution_paused` в
        ответе на метрики. С `cancel_running: true` выполняемым задачам выставляется флаг отмены.
        Нажать может `execution.admin`; повторный вход при включении не требуется — важна скорость.
      x-required-permission: execution.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchInput'
      responses:
        '200':
          description: Состояние стоп-крана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/signing-keys:
    get:
      tags: [execution-admin]
      operationId: listSigningKeys
      summary: Ключи подписантов
      description: Отпечатки из этого списка администратор домена вносит в GPO `TrustedSigners`.
      x-required-permission: [execution.admin, script.approve, package.approve]
      responses:
        '200':
          description: Ключи
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SigningKey'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [execution-admin]
      operationId: registerSigningKey
      summary: Зарегистрировать открытый ключ сотрудника
      description: |
        Ключ создаётся на токене (PIV) и не покидает его. Аттестация PIV подтверждает, что ключ
        сгенерирован на устройстве. Регистрация сама по себе агентам ничего не разрешает: они
        доверяют только отпечаткам из локальной политики.
      x-required-permission: execution.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningKeyInput'
      responses:
        '201':
          description: Ключ зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/signing-keys/{keyId}/revoke:
    parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [execution-admin]
      operationId: revokeSigningKey
      summary: Отозвать ключ
      description: |
        Отзыв окончателен. Сервер перестаёт принимать подписи этим ключом. Версии, подписанные им,
        выводятся из обращения, а их открытые задачи отменяются. Отпечаток также удаляется из GPO
        `TrustedSigners` — после этого агенты отвергают такие подписи и без сервера.
      x-required-permission: execution.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '204':
          description: Отозван
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/execution/permissions:
    get:
      tags: [execution-admin]
      operationId: listPermissionGrants
      summary: Выданные права модуля
      x-required-permission: execution.admin
      responses:
        '200':
          description: Права
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [execution-admin]
      operationId: grantPermission
      summary: Выдать право (себе — нельзя)
      x-required-permission: execution.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantInput'
      responses:
        '201':
          description: Право выдано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/execution/permissions/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [execution-admin]
      operationId: revokePermission
      summary: Отозвать право
      x-required-permission: execution.admin
      responses:
        '204':
          description: Отозвано
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# =============================================================================
# Исходящие webhook-уведомления (сервер → внешняя система)
# =============================================================================
webhooks:
  alertEvent:
    post:
      operationId: alertWebhook
      summary: Событие алерта
      description: |
        Отправляется на URL канала типа `webhook`. Заголовки:
        `X-InvMon-Event` (тип события), `X-InvMon-Delivery` (UUID доставки — для идемпотентности у получателя),
        `X-InvMon-Signature: t=<unix-время>,v1=<hex HMAC-SHA256(secret, "<t>.<тело>")>`.
        Получатель должен проверять подпись и отбрасывать сообщения с `t` старше 5 минут.
        Ожидается ответ 2xx за `timeout_s`; иначе — повтор с экспоненциальной задержкой (до 10 попыток).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Принято получателем

components:
  securitySchemes:
    enrollmentToken:
      type: http
      scheme: bearer
      description: Токен регистрации `imenr_…` (выдаётся администратором, ограничен сроком и числом использований)
    deviceToken:
      type: http
      scheme: bearer
      description: Токен устройства `imagt_…` (256 бит случайных данных; на сервере хранится SHA-256)
    session:
      type: apiKey
      in: cookie
      name: __Host-invmon_session

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `next_cursor` предыдущей страницы
      schema:
        type: string
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      schema:
        type: string
        enum: [gzip, identity]
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PackageVersionId:
      name: packageVersionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SubjectType:
      name: subjectType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SubjectType'
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID запроса; повтор с тем же ключом в течение 24 ч возвращает исходный результат
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос / ошибка валидации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://invmon.corp.local/problems/validation
            title: Validation failed
            status: 400
            code: validation_failed
            errors:
              - field: host[3].cpu_pct
                message: must be between 0 and 100
    Unauthorized:
      description: Нет или неверные учётные данные / токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://invmon.corp.local/problems/unauthorized
            title: Invalid or expired token
            status: 401
            code: invalid_token
    ReauthRequired:
      description: |
        Нужен повторный вход не старше 10 минут (step-up) — для изменяющих операций модуля
        выполнения; либо нет сессии
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://invmon.corp.local/problems/reauthentication-required
            title: Recent re-authentication required
            status: 401
            code: reauthentication_required
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DeviceForbidden:
      description: |
        Устройство не может отправлять данные: `code` = `pending_approval` (ждёт одобрения —
        агент повторяет раз в 5 минут) или `device_revoked` (агент прекращает отправку).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://invmon.corp.local/problems/pending-approval
            title: Device is pending approval
            status: 403
            code: pending_approval
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт состояния (например, алерт уже закрыт)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Превышен лимит размера тела (после распаковки)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов; агент обязан выдержать паузу из `Retry-After`
      headers:
        Retry-After:
          schema:
            type: integer
          description: Секунды до повтора
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------------ общие
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Машинный код ошибки
          examples: [invalid_token, validation_failed, pending_approval, device_revoked, rate_limited]
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Severity:
      type: string
      enum: [info, warning, critical]
    DeviceStatus:
      type: string
      enum: [pending, active, revoked, retired]
    Arch:
      type: string
      enum: [x86, x64, arm64]
    Percent:
      type: number
      format: float
      minimum: 0
      maximum: 100
    Bytes:
      type: integer
      format: int64
      minimum: 0

    # ------------------------------------------------------------ Agent API
    AgentConfig:
      type: object
      description: Декларативная конфигурация сбора — единственное, что сервер «сообщает» агенту
      required: [config_version, metrics_send_interval_s, cpu_sample_interval_s, disk_interval_s,
                 inventory_interval_s, inventory_full_resend_s, collect_logged_on_user]
      properties:
        config_version:
          type: integer
          minimum: 1
        metrics_send_interval_s:
          type: integer
          minimum: 30
          maximum: 600
          default: 60
        cpu_sample_interval_s:
          type: integer
          minimum: 5
          maximum: 60
          default: 15
        disk_interval_s:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
        inventory_interval_s:
          type: integer
          minimum: 600
          maximum: 86400
          default: 3600
          description: Как часто агент пересчитывает хэш инвентаризации
        inventory_full_resend_s:
          type: integer
          minimum: 3600
          maximum: 604800
          default: 86400
          description: Как часто отправлять полный снимок, даже если хэш не изменился
        collect_logged_on_user:
          type: boolean
          default: false
          description: Передавать ли имя пользователя активной сессии (решение по политике организации)
      example:
        config_version: 3
        metrics_send_interval_s: 60
        cpu_sample_interval_s: 15
        disk_interval_s: 300
        inventory_interval_s: 3600
        inventory_full_resend_s: 86400
        collect_logged_on_user: false

    OsInfo:
      type: object
      required: [name, version, arch]
      properties:
        name:
          type: string
          maxLength: 256
          description: Win32_OperatingSystem.Caption
        version:
          type: string
          maxLength: 64
          description: Версия с UBR, например 10.0.22631.4169
        build:
          type: integer
        ubr:
          type: integer
        display_version:
          type: string
          maxLength: 32
          description: DisplayVersion / ReleaseId из реестра (23H2, 22H2…) либо «SP1» для Windows 7
        arch:
          $ref: '#/components/schemas/Arch'
        install_date:
          type: string
          format: date-time
        last_boot:
          type: string
