  /api/v1/script-runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [script-runs]
      operationId: cancelScriptRun
      summary: Отменить запуск
      description: |
        Отменить может инициатор или пользователь с `task.cancel_any`.
        * Задачи в очереди и выданные агенту, но ещё не начатые, отменяются сразу: на событие
          `started` агент получит 409 и не запустит процесс.
        * Выполняемым задачам выставляется флаг отмены. Агент узнаёт о нём из ответа на ближайший
          heartbeat (не реже раза в 10 с), завершает Job Object задачи вместе с дочерними процессами
          и присылает итог `canceled`.
        * Завершённые задачи не меняются. Повторная отмена — 409.
      x-required-permission: [script.run, script.run_high_impact, task.cancel_any]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
            example:
              reason: 'Ошибка в параметрах, перезапуск по INC-1024'
      responses:
        '202':
          description: Отмена принята; итог выполняемых задач придёт от агентов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [script-runs]
      operationId: getAgentTask
      summary: Задача на ПК с выводом (stdout / stderr)
      description: |
        Вывод может содержать персональные данные, поэтому нужно право `task.view_output` в группе ПК.
        Каждый просмотр пишется в аудит (`task.output_view`). Вывод хранится `output_retention_days`
        (по умолчанию 90 дней), затем очищается; код возврата и итог хранятся дольше.
      x-required-permission: task.view_output
      responses:
        '200':
          description: Задача и вывод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskDetails'
        '403':
