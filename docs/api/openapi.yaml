        next_cursor:
          type: [string, 'null']
    ScriptVersionInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 262144
          description: |
            Код скрипта (UTF-8). Параметры скрипт получает в переменных окружения
            `INVMON_PARAM_<ИМЯ>` — не в командной строке.
        params_schema:
          type: object
          description: |
            Подмножество JSON Schema: объект с `properties` типов string, integer, boolean и
            `additionalProperties: false`. У строк обязательны `enum` или `pattern` + `maxLength`;
            для cmd в строках запрещены символы `& | < > ^ % ! "`.
          additionalProperties: true
        timeout_s:
          type: integer
          minimum: 10
          maximum: 14400
          default: 600
        run_as:
          type: string
          enum: [system, local_service]
          default: system
          description: LocalSystem или NT AUTHORITY\LocalService (диагностика без прав администратора)
        max_output_bytes:
          type: integer
          minimum: 1024
          maximum: 10485760
          default: 1048576
        success_exit_codes:
          type: array
          minItems: 1
          maxItems: 20
          default: [0]
          items:
            type: integer
        min_os_build:
          type: [integer, 'null']
          description: 7601 — Windows 7 SP1, 9600 — 8.1, 19045 — 10 22H2
        min_powershell_version:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]+$'
        change_note:
          type: string
          maxLength: 2000
      example:
        content: |
          $days  = [int]$env:INVMON_PARAM_MIN_AGE_DAYS
          $limit = (Get-Date).AddDays(-$days)
          $deleted = 0; $freed = 0
          Get-ChildItem "$env:SystemRoot\Temp" -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { -not $_.PSIsContainer -and $_.LastWriteTime -lt $limit } |
              ForEach-Object {
                  try { $len = $_.Length; Remove-Item -LiteralPath $_.FullName -Force -ErrorAction Stop; $deleted++; $freed += $len }
                  catch { }   # файл занят — пропускаем
              }
          "Удалено файлов: $deleted, освобождено МБ: $([math]::Round($freed / 1MB, 1))"
        params_schema:
          type: object
          additionalProperties: false
          required: [min_age_days]
          properties:
            min_age_days:
              type: integer
              minimum: 1
              maximum: 365
        timeout_s: 600
        run_as: system
        max_output_bytes: 65536
        success_exit_codes: [0]
        min_os_build: 7601
        min_powershell_version: '2.0'
        change_note: Порог возраста файлов вынесен в параметр
