            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
