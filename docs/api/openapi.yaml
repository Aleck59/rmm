    Detection:
      type: object
      description: |
        Как агент определяет, установлено ли ПО (до и после установки):
        * `msi_product_code` — продукт с `product_code` зарегистрирован в Windows Installer;
        * `uninstall_entry` — запись в Uninstall (HKLM, 32- и 64-битная ветки): `display_name` —
          регулярное выражение, версия не ниже `min_version`;
        * `file_version` — версия файла `path` (переменные окружения раскрываются) не ниже `min_version`;
        * `registry_value` — значение `value_name` ключа `key` (HKLM) не ниже `min_version`.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [msi_product_code, uninstall_entry, file_version, registry_value]
        product_code:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 200
        path:
          type: string
          maxLength: 260
        key:
          type: string
          maxLength: 260
        value_name:
          type: string
          maxLength: 200
        min_version:
          type: string
          maxLength: 50
    PackageVersionInput:
      type: object
      required: [version, arch, installer_type, detection]
      properties:
        version:
          type: string
          maxLength: 100
        arch:
          type: string
          enum: [x86, x64, arm64, any]
        installer_type:
          type: string
          enum: [msi, exe, script]
        file_sha256:
          $ref: '#/components/schemas/Sha256Hex'
        install_args:
          type: string
          maxLength: 2000
          description: EXE — ключи тихой установки; MSI — только свойства `ИМЯ=значение` (ключи msiexec задаёт агент)
        uninstall_command:
          type: [string, 'null']
          maxLength: 260
          description: EXE — путь к деинсталлятору (переменные окружения раскрываются); без него удаление недоступно
        uninstall_args:
          type: string
          maxLength: 2000
        msi_product_code:
          type: [string, 'null']
          format: uuid
        install_script_version_id:
          type: [integer, 'null']
          format: int64
          description: Для installer_type `script` — одобренная версия скрипта; её код входит в манифест пакета
        uninstall_script_version_id:
          type: [integer, 'null']
          format: int64
        detection:
          $ref: '#/components/schemas/Detection'
        success_exit_codes:
          type: array
          maxItems: 20
          default: [0, 1641, 3010]
          items:
            type: integer
        timeout_s:
          type: integer
          minimum: 60
          maximum: 14400
          default: 3600
        reboot_behavior:
          type: string
          enum: [suppress, allow_in_window]
          default: suppress
        require_authenticode:
          type: boolean
          default: true
        expected_signer:
          type: [string, 'null']
          maxLength: 200
      example:
        version: 129.0.6668.90
        arch: x64
        installer_type: msi
        file_sha256: a01c7770d00d62efa5311a5a9d8c6f4f068eff1e7e1382ffe93e34cc79bd4566
        install_args: ''
        msi_product_code: 6f2a0e1c-3b8d-4c5e-9a7f-1d2e3f4a5b6c
        detection:
          type: uninstall_entry
          display_name: '^Google Chrome$'
          min_version: 129.0.6668.90
        success_exit_codes: [0, 1641, 3010]
        timeout_s: 1800
        reboot_behavior: suppress
        require_authenticode: true
        expected_signer: Google LLC
