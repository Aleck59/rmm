  /api/v1/package-files/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Sha256Hex'
    put:
      tags: [packages]
      operationId: uploadPackageFile
      summary: Загрузить установщик (адресация по содержимому)
      description: |
        Тело — файл установщика (до 2 ГБ). Сервер сверяет SHA-256 тела с путём, поэтому повторная
        загрузка идемпотентна. Подпись издателя (Authenticode) проверяется для информации;
        окончательно её проверяет агент на ПК. Файлы хранятся вне БД, в каталоге данных сервера.
      x-required-permission: package.manage
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
          example: googlechromestandaloneenterprise64.msi
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Такой файл уже загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageFile'
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

