      description: |
        Проверки и постановка задач — как у `createScriptRun`. Вдобавок:
        * версия пакета `approved`; для удаления в её манифесте есть способ удаления;
        * задачи раскладываются по кольцам (`ring_plan`); кольцо N+1 открывается, когда кольцо N
          завершено, доля ошибок в нём не выше `max_failure_pct` и прошла выдержка `soak_hours`;
        * при превышении порога ошибок развёртывание встаёт на паузу с `paused_reason`;
        * задача выдаётся только в окне обслуживания, а после `deadline` — в любое время.
          Перезагрузка по умолчанию подавляется: итог `reboot_required` виден в отчёте.
      x-required-permission: deployment.run
      parameters:
