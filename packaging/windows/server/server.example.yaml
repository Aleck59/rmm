# InvMon server configuration (Stage 0).
# Copied to C:\ProgramData\InvMon\Server\server.yaml by install.ps1.
# Database, SMTP and security sections are added in later stages.

public_url: 'https://invmon.corp.local'

# Admin web UI + web API listener.
web_addr: ':443'

# Agent API listener (reserved; agent ingest lands in Stage 1).
agent_addr: ':8443'

# TLS certificate and key (PEM). When both are empty the server falls back to
# plain HTTP — development only. In production point these at a certificate
# issued by your corporate CA (or generated by `invmon-server gen-certs`,
# available from Stage 4).
tls_cert: ''
tls_key: ''

# debug | info | warn | error
log_level: info
