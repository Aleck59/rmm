# InvMon server configuration.
# Copied to C:\ProgramData\InvMon\Server\server.yaml by install.ps1.

public_url: 'https://invmon.corp.local'

# Admin web UI + web API listener (open only to the IT network / VPN).
web_addr: ':443'

# Agent API listener (open to workstation subnets).
agent_addr: ':8443'

# TLS certificate and key (PEM), used by both listeners. When both are empty
# the server falls back to plain HTTP — development only. In production use a
# certificate issued by your corporate CA.
tls_cert: ''
tls_key: ''

# PostgreSQL 17/18 — required for the agent API. Until it is configured the
# server runs the web UI only and /readyz reports "database not configured".
# `url` is used by the running server (least-privileged role), `migrate_url`
# to apply schema migrations at start-up (schema-owner role; defaults to `url`).
# The INVMON_DATABASE_URL environment variable overrides `url`.
# Keep this file readable only by SYSTEM, Administrators and the service account.
#database:
#  url: 'postgres://invmon_app:PASSWORD@localhost:5432/invmon?sslmode=disable'
#  migrate_url: 'postgres://invmon_owner:PASSWORD@localhost:5432/invmon?sslmode=disable'

# debug | info | warn | error
log_level: info
